; PHP Configuration for Vessel Logger USB Deployment
; Optimized for portable operation with SQLite

[PHP]
; Core Settings
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
implicit_flush = Off
zend.enable_gc = On

; Resource Limits
max_execution_time = 300
max_input_time = 60
memory_limit = 256M
default_socket_timeout = 60

; Error handling
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "../../../data/logs/php_errors.log"

; File Uploads
file_uploads = On
upload_tmp_dir = "../../../data/temp"
upload_max_filesize = 50M
max_file_uploads = 20
post_max_size = 50M

; Security
allow_url_fopen = Off
allow_url_include = Off

; Extensions required for Vessel Logger
extension=sqlite3
extension=pdo_sqlite
extension=openssl
extension=curl
extension=mbstring
extension=json
extension=fileinfo

; Session handling
session.save_handler = files
session.save_path = "../../../data/temp"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = VESSEL_SESSID
session.cookie_lifetime = 7200
session.cookie_httponly = 1
session.cookie_samesite = "Strict"

; Date/Time
date.timezone = UTC

; Performance optimizations
realpath_cache_size = 4096K
realpath_cache_ttl = 120
