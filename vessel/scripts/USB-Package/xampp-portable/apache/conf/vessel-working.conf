# Vessel Logger - Working Configuration
# Based on successful XAMPP setup

ServerRoot "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/apache"
PidFile logs/httpd.pid
Listen 8080

# Essential modules from working XAMPP
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so

# PHP module - use direct path to the DLL in PHP directory
LoadModule php_module "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/php/php8apache2_4.dll"

# PHP settings
AddHandler application/x-httpd-php .php
AddType application/x-httpd-php .php .phtml
PHPIniDir "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/php"

# Document root
DocumentRoot "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app"

# Directory configuration - DISABLE .htaccess to prevent conflicts
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app">
    AllowOverride None
    Options Indexes FollowSymLinks Includes ExecCGI
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# BLOCK access to parent directories
<Directory "C:/">
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory "C:/xampp/">
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/">
    AllowOverride None
    Options None
    Require all denied
</Directory>

# ONLY allow vessel app
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app">
    AllowOverride None
    Options Indexes FollowSymLinks Includes ExecCGI
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# MIME types
TypesConfig conf/mime.types
DefaultType text/plain

# Logging
ErrorLog "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/logs/apache_error.log"
LogLevel warn

# Basic security
ServerTokens OS
ServerSignature On

# Windows MPM
<IfModule mpm_winnt_module>
    ThreadsPerChild 150
    MaxRequestsPerChild 0
</IfModule>
