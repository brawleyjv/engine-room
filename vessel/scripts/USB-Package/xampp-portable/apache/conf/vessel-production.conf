# Vessel Logger - Production Apache Configuration
# Port 8080 ONLY - Blocks port 80 conflicts
# Fully functional PHP + SQLite integration

# Server basics - ONLY port 8080
ServerRoot "../"
Listen 8080
ServerName localhost:8080

# DO NOT listen on port 80 at all - this prevents conflicts

# Essential Apache modules
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule dir_module modules/mod_dir.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so

# PHP module - using the copied module in Apache modules directory
LoadModule php_module modules/mod_php.so

# PHP Configuration
PHPIniDir "../php"
AddType application/x-httpd-php .php .php8

# Document root - VESSEL APP ONLY
DocumentRoot "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app"

# Main vessel application directory
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</Directory>

# SECURITY: Block access to ALL parent directories
<Directory "C:/">
    Require all denied
</Directory>

<Directory "C:/xampp/">
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/">
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/enginerm/">
    Require all denied
</Directory>

# ONLY allow vessel app directory
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app">
    Require all granted
</Directory>

# Protect sensitive vessel app directories
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app/config">
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/database">
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/logs">
    Require all denied
</Directory>

# File type restrictions
<Files "*.sql">
    Require all denied
</Files>

<Files "*.db">
    Require all denied
</Files>

<Files "*.log">
    Require all denied
</Files>

<Files ".ht*">
    Require all denied
</Files>

# MIME types
TypesConfig conf/mime.types

# Logging
ErrorLog "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/logs/apache_error.log"
CustomLog "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/logs/apache_access.log" combined
LogLevel warn

# Security settings
ServerTokens Prod
ServerSignature Off

# Performance for USB/portable environment
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Windows-specific performance
<IfModule mpm_winnt_module>
    ThreadsPerChild 64
    MaxRequestsPerChild 0
</IfModule>

# URL Rewriting for clean URLs (if needed)
<IfModule mod_rewrite.c>
    RewriteEngine On
    
    # Block direct access to sensitive files
    RewriteRule ^(.*/)?\.ht - [F,L]
    RewriteRule ^(.*/)?config/ - [F,L]
    RewriteRule ^(.*/)?data/ - [F,L]
    RewriteRule ^(.*/)?\.sql$ - [F,L]
    RewriteRule ^(.*/)?\.log$ - [F,L]
    RewriteRule ^(.*/)?\.db$ - [F,L]
    
    # Health check endpoint
    RewriteRule ^health/?$ /test.php [L]
</IfModule>

# Compression for better performance over USB
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/json
</IfModule>
