# Vessel Logger - Portable Apache Configuration
# This configuration is designed for USB deployment

# Get the current directory dynamically
Define VESSEL_ROOT "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package"

# Basic server settings
ServerRoot "${VESSEL_ROOT}/xampp-portable/apache"
Listen 8080
ServerName localhost:8080

# Modules - minimal set for PHP and basic functionality
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule php_module modules/mod_php.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule expires_module modules/mod_expires.so

# PHP Configuration
PHPIniDir "${VESSEL_ROOT}/xampp-portable/php"
AddType application/x-httpd-php .php

# Document root points to vessel application
DocumentRoot "${VESSEL_ROOT}/app"

# Directory settings for vessel application
<Directory "${VESSEL_ROOT}/app">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    
    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # PHP settings for vessel logger
    php_value max_execution_time 300
    php_value memory_limit 256M
    php_value upload_max_filesize 50M
    php_value post_max_size 50M
    
    # Session settings
    php_value session.cookie_secure 0
    php_value session.cookie_httponly 1
    php_value session.use_strict_mode 1
    php_value session.cookie_samesite "Strict"
</Directory>

# Block access to parent directories and their .htaccess files
<Directory "C:/xampp/htdocs">
    AllowOverride None
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/enginerm">
    AllowOverride None
    Require all denied
</Directory>

# Error and access logs
ErrorLog "${VESSEL_ROOT}/data/logs/apache_error.log"
CustomLog "${VESSEL_ROOT}/data/logs/apache_access.log" combined

# Security - disable server signature
ServerTokens Prod
ServerSignature Off

# MIME types
TypesConfig conf/mime.types

# Directory index
DirectoryIndex index.php index.html

# Rewrite rules for clean URLs
<IfModule mod_rewrite.c>
    RewriteEngine On
    
    # Block access to sensitive files
    RewriteRule ^(.*/)?\.ht - [F,L]
    RewriteRule ^(.*/)?config/ - [F,L]
    RewriteRule ^(.*/)?data/database/ - [F,L]
    RewriteRule ^(.*/)?\.sql$ - [F,L]
    RewriteRule ^(.*/)?\.log$ - [F,L]
    
    # Test endpoint for startup script
    RewriteRule ^vessel-test$ /index.php?test=1 [L]
    
    # API endpoints
    RewriteRule ^api/(.*)$ /api/index.php?endpoint=$1 [L,QSA]
    
    # Clean URLs for main application
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ /index.php?route=$1 [L,QSA]
</IfModule>

# Compression for better performance
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/plain
    AddOutputFilterByType DEFLATE text/html
    AddOutputFilterByType DEFLATE text/xml
    AddOutputFilterByType DEFLATE text/css
    AddOutputFilterByType DEFLATE application/xml
    AddOutputFilterByType DEFLATE application/xhtml+xml
    AddOutputFilterByType DEFLATE application/rss+xml
    AddOutputFilterByType DEFLATE application/javascript
    AddOutputFilterByType DEFLATE application/x-javascript
</IfModule>

# Cache headers for static files
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/jpg "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/ico "access plus 1 month"
    ExpiresByType image/icon "access plus 1 month"
    ExpiresByType text/ico "access plus 1 month"
    ExpiresByType application/ico "access plus 1 month"
</IfModule>

# Basic MIME types  
TypesConfig "${VESSEL_ROOT}/xampp-portable/apache/conf/mime.types"

# Default file handling
DirectoryIndex index.php index.html

# Timeout settings
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
