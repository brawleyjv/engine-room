# Vessel Logger - Corrected Apache Configuration
# This configuration addresses all the path and module issues

# Basic server settings - use forward slashes for Windows compatibility
ServerRoot "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/apache"
Listen 8080
ServerName localhost:8080

# Essential modules only
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule dir_module modules/mod_dir.so
LoadModule setenvif_module modules/mod_setenvif.so

# PHP module - correct name from our check
LoadModule php_module "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/php/php8apache2_4.dll"

# PHP Configuration
PHPIniDir "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/php"
AddType application/x-httpd-php .php

# Document root points to vessel application
DocumentRoot "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app"

# Directory settings for vessel application
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Deny access to sensitive directories
<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/app/config">
    Require all denied
</Directory>

<Directory "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/database">
    Require all denied
</Directory>

# MIME types
TypesConfig "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/xampp-portable/apache/conf/mime.types"

# Logging
ErrorLog "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/logs/apache_error.log"
CustomLog "C:/xampp/htdocs/enginerm/vessel/scripts/USB-Package/data/logs/apache_access.log" combined

# Log level for debugging
LogLevel warn

# Security
ServerTokens Prod
ServerSignature Off

# Performance settings for portable USB environment
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Windows-specific settings
<IfModule mpm_winnt_module>
    ThreadsPerChild 64
    MaxRequestsPerChild 0
</IfModule>

# Basic security headers
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
</IfModule>
